<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kingdom Come: Multiplayer</title>
    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <link href="css/site.css" rel="stylesheet" />
    <link href="css/modals.css" rel="stylesheet" />
    <link href="KCDMP_launcher.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">Loading...</div>

    <script src="_framework/blazor.webview.js"></script>
    <script>
        // WO-19: pushes the current StyleProfile's colours over site.css's
        // :root defaults, so the profile -- not the stylesheet -- is the
        // live theme. See StyleProfile.ToCssVariables and Home.razor.cs.
        window.applyKcdTheme = (vars) => {
            const root = document.documentElement.style;
            for (const key in vars) {
                root.setProperty(key, vars[key]);
            }
        };

        window.registerGlobalKeys = (dotNetHelper) => {
            window.addEventListener('keydown', (e) => {
                console.log("Key pressed:", e.key);

                // ESC -> Exit
                if (e.key === "Escape") {
                    dotNetHelper.invokeMethodAsync('ExitApp');
                }

                // TAB -> Toggle Filters
                if (e.key === "Tab") {
                    e.preventDefault();
                    dotNetHelper.invokeMethodAsync('ToggleFiltersJS');
                }

                // F5 -> Refresh
                if (e.key === "F5") {
                    e.preventDefault();
                    dotNetHelper.invokeMethodAsync('RefreshApp');
                }

                // F10 -> Settings
                if (e.key === "F10") {
                    e.preventDefault();
                    dotNetHelper.invokeMethodAsync('ToggleSettingsJS');
                }
            });
        };
    </script>
</body>
</html>
